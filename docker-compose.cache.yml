services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: [mongo-cache-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-cache-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: .
      dockerfile: apps/cache-demo/Dockerfile.api
    restart: unless-stopped
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/cache_demo
      REDIS_URL: redis://redis:6379
      CACHE_TTL_SECONDS: 60
      SEED_COUNT: 1000000
    ports: ["3000:3000"]
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: apps/cache-demo/Dockerfile.web
    restart: unless-stopped
    ports: ["8080:80"]
    depends_on: [api]
volumes:
  mongo-cache-data:
  redis-cache-data: